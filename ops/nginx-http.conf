server {
    listen 80;
    server_name 36-reach-rich.jeongcheol.cloud;
    client_max_body_size 32k;

    location /.well-known/acme-challenge/ {
        root /var/www/reach-rich-acme;
    }

    location / {
        # Removed only after final data reconciliation and HTTPS provisioning.
        return 503 "REACH RICH migration in progress. Please try again shortly.\n";
        add_header Retry-After 300 always;
    }
}
