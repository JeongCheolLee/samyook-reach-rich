server {
    listen 80;
    server_name 36-reach-rich.jeongcheol.cloud;
    location /.well-known/acme-challenge/ { root /var/www/reach-rich-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name 36-reach-rich.jeongcheol.cloud;
    ssl_certificate /etc/letsencrypt/live/36-reach-rich.jeongcheol.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/36-reach-rich.jeongcheol.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;

    location / {
        proxy_pass http://127.0.0.1:3106;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # This host is the public ingress: overwrite untrusted client headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 60s;
        add_header X-Content-Type-Options nosniff always;
    }
}
